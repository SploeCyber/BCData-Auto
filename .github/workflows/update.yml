name: Update game data

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      regions:
        description: "Regions to check (comma separated: en,jp,kr,tw)"
        required: false
        default: "en,jp,kr,tw"
      force:
        description: "Reprocess even if version already in metadata"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: update-game-data
  cancel-in-progress: false

env:
  TOOL_CACHE_VERSION: v2 # bump to force a rebuild of the Rust tools

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL || true
          df -h .

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust tools
        id: tool-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: rust-tools-${{ runner.os }}-${{ env.TOOL_CACHE_VERSION }}-${{ hashFiles('.github/workflows/update.yml', 'scripts/setup_tools.sh') }}

      - name: Install tools (apkdown, tbctk-cli, APKEditor)
        run: bash scripts/setup_tools.sh

      - name: Set git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run updater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS="--regions '${{ inputs.regions || 'en,jp,kr,tw' }}'"
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          eval python3 update.py $ARGS

      - name: Disk usage summary
        if: always()
        run: df -h .
